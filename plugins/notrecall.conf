# NotRecall Steam Play Compatibility Plugin for NotProton
# Installed to: ~/Library/Application Support/notproton/plugins/notrecall.conf
# Runtime:      Recall Wine + DXMT on stock NotProton
#
# notrecall-proton is adopted by stock NotProton via compatibilitytools.d/notrecall-proton/{build,flavor},
# so NotProton's hook_launch.c wraps launches in /bin/sh -c (enabling both Compatibility page options and
# custom KEY=VAL %command% launch options without macOS Steam OS Error 260).
#
# [NOTPROTON_NOTRECALL] sits first so NotProton.app's Plugins tab lists this plugin as "NotRecall" and
# checks live runtime readiness via "requires" (without "inject = 1"). Its non-matching "tools" value
# prevents Steam from rendering it as an extra master toggle, so every option below is immediately visible
# whenever notrecall-proton is selected. "hide_crossover = 1" suppresses CrossOver's built-in checkboxes.

[NOTPROTON_NOTRECALL]
label       = NotRecall
description = Recall Wine + DXMT settings for macOS.
tools       = notrecall-plugin
requires    = Library/Application Support/notrecall/runtime/bin/wine

# ==============================================================================
# Graphics & Performance
# ==============================================================================

[NOTPROTON_NOTRECALL_METALFX]
label          = MetalFX Upscaling
description    = Adds NVIDIA DLSS to the game's Video settings and runs it natively on Apple MetalFX.
section        = dev
tools          = notrecall-proton*
hide_crossover = 1
on             = 1
requires       = Library/Application Support/notrecall/runtime/bin/wine
env            = DXMT_ENABLE_NVEXT=1

[NOTPROTON_ENV_NOTRECALL_METALFX_SHARPNESS]
label          = Sharpening
description    = Increases edge sharpness when MetalFX Upscaling is on.
section        = dev
type           = choice
tools          = notrecall-proton*
depends        = NOTPROTON_NOTRECALL_METALFX
requires       = Library/Application Support/notrecall/runtime/bin/wine
choice         = off = Off
choice         = low = Low
choice         = high = High

[NOTPROTON_NOTRECALL_MTL_HUD]
label          = Metal Performance HUD
description    = Displays Apple's frame rate, frame time, memory, and shader compilation overlay in game.
section        = dev
tools          = notrecall-proton*
on             = 1
requires       = Library/Application Support/notrecall/runtime/bin/wine
env            = MTL_HUD_ENABLED=1

[NOTPROTON_ENV_NOTRECALL_FRAME_PACING]
label          = Frame Pacing
description    = Waits briefly between frames so each frame samples fresher mouse input.
section        = dev
type           = choice
tools          = notrecall-proton*
requires       = Library/Application Support/notrecall/runtime/bin/wine
choice         = on = On (Default)
choice         = off = Off

[NOTPROTON_ENV_NOTRECALL_FPS_LIMIT]
label          = Frame Rate Limit
description    = Caps DXMT's frame rate instead of using the game's own limit.
section        = dev
type           = slider
tools          = notrecall-proton*
requires       = Library/Application Support/notrecall/runtime/bin/wine
default        = 0
choice         = 0 = Off
choice         = 60 = 60 FPS
choice         = 90 = 90 FPS
choice         = 120 = 120 FPS
choice         = 144 = 144 FPS
choice         = 240 = 240 FPS

[NOTPROTON_ENV_NOTRECALL_SHADER_MEM_MB]
label          = Shader Memory
description    = Controls how much of the shader cache loads at launch to prevent stutters.
section        = dev
type           = choice
tools          = notrecall-proton*
requires       = Library/Application Support/notrecall/runtime/bin/wine
choice         = all = All (Default)
choice         = first = Slowest Only
choice         = 256 = 256 MB
choice         = 512 = 512 MB
choice         = 1024 = 1 GB
choice         = 2048 = 2 GB

# ==============================================================================
# Mouse & Input
# ==============================================================================

[NOTPROTON_ENV_NOTRECALL_MOUSE_MODE]
label          = Mouse Mode
description    = Selects how mouse movement is captured, with High-Precision reading the mouse directly when Input Monitoring is granted.
section        = dev
type           = choice
tools          = notrecall-proton*
requires       = Library/Application Support/notrecall/runtime/bin/wine
choice         = hid = High-Precision (Recommended)
choice         = precise = Standard (No permission needed)
choice         = classic = Classic (Recall 1.4 feel)
choice         = off = macOS Pointer

[NOTPROTON_ENV_NOTRECALL_MOUSE_RATE]
label          = Mouse Polling Limit
description    = Caps mouse reports per second in High-Precision and Standard modes to avoid high-polling stutters.
section        = dev
type           = choice
tools          = notrecall-proton*
requires       = Library/Application Support/notrecall/runtime/bin/wine
choice         = all = All Reports (Default)
choice         = 2000 = 2,000 Hz
choice         = 1000 = 1,000 Hz
choice         = 500 = 500 Hz
choice         = 250 = 250 Hz

[NOTPROTON_NOTRECALL_FAST_KEYS]
label          = Faster Key Response
description    = Delivers key presses 1 to 3 ms sooner, though menus may hitch slightly with high-polling mice.
section        = dev
tools          = notrecall-proton*
on             = 1
requires       = Library/Application Support/notrecall/runtime/bin/wine
env            = WINEMAC_APPKIT_UPDATE_CYCLE=0

[NOTPROTON_NOTRECALL_RAW_CONTROLLERS]
label          = Raw Controller Input
description    = Lets the game read controllers directly instead of through Steam Input, which may cause double inputs.
section        = dev
tools          = notrecall-proton*
on             = 1
requires       = Library/Application Support/notrecall/runtime/bin/wine
env            = NOTRECALL_RAW_CONTROLLERS=1

# ==============================================================================
# System & Runtime
# ==============================================================================

[NOTPROTON_ENV_NOTRECALL_GAME_MODE]
label          = macOS Game Mode
description    = Gives the game CPU and GPU priority while running in fullscreen.
section        = dev
type           = choice
tools          = notrecall-proton*
requires       = Library/Application Support/notrecall/runtime/bin/wine
choice         = on = On (Default)
choice         = off = Off

[NOTPROTON_ENV_NOTRECALL_BACKGROUND_SHADERS]
label          = Background Shader Optimization
description    = Compiles newly discovered shaders into archives after each session to reduce future stutters.
section        = dev
type           = choice
tools          = notrecall-proton*
requires       = Library/Application Support/notrecall/runtime/bin/wine
choice         = on = On (Default)
choice         = off = Off

[NOTPROTON_ENV_NOTRECALL_MSYNC]
label          = MSync
description    = Uses Mach-based synchronization for better performance instead of Wine's older server synchronization.
section        = dev
type           = choice
tools          = notrecall-proton*
requires       = Library/Application Support/notrecall/runtime/bin/wine
choice         = on = On (Default)
choice         = off = Off

[NOTPROTON_NOTRECALL_PROXY_AUTO_DETECT]
label          = Automatic Proxy Detection
description    = Checks for a local network proxy automatically for work or school networks.
section        = dev
tools          = notrecall-proton*
on             = 1
requires       = Library/Application Support/notrecall/runtime/bin/wine
env            = NOTRECALL_PROXY_AUTO_DETECT=1

[NOTPROTON_ENV_NOTRECALL_BT_MIC_ROUTING]
label          = Bluetooth Mic Routing
description    = Routes Wine's microphone to your Mac's built-in mic when using Bluetooth headphones to preserve audio quality.
section        = dev
type           = choice
tools          = notrecall-proton*
requires       = Library/Application Support/notrecall/runtime/bin/wine
choice         = on = On (Default)
choice         = off = Off

# ==============================================================================
# Diagnostics
# ==============================================================================

[NOTPROTON_NOTRECALL_LOG_CRASHES]
label          = Crash & Freeze Logs
description    = Records Wine errors and loaded DLLs for bug reports, which may lower FPS.
section        = dev
tools          = notrecall-proton*
on             = 1
requires       = Library/Application Support/notrecall/runtime/bin/wine
env            = NOTRECALL_LOG_CRASHES=1

[NOTPROTON_NOTRECALL_LOG_GRAPHICS]
label          = Graphics Logs (DXMT)
description    = Writes detailed DXMT graphics logs to compatdata/<appid>/dxmt-logs/, which may lower FPS.
section        = dev
tools          = notrecall-proton*
on             = 1
requires       = Library/Application Support/notrecall/runtime/bin/wine
env            = NOTRECALL_LOG_GRAPHICS=1

[NOTPROTON_NOTRECALL_LOG_MOUSE]
label          = Mouse Input Logs
description    = Records mouse polling stats to compatdata/<appid>/input-logs/, which may lower FPS.
section        = dev
tools          = notrecall-proton*
on             = 1
requires       = Library/Application Support/notrecall/runtime/bin/wine
env            = NOTRECALL_LOG_MOUSE=1
