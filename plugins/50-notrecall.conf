# NotProton plugin descriptor for NotRecall (notrecall-proton).
# Installed to ~/Library/Application Support/notproton/plugins/50-notrecall.conf
#
# Because notrecall-proton is a third-party compatibility tool (ours=0 in
# NotProton's webpatch.c):
#   - Toggles write their `env = KEY=VAL` entries directly via `env ... %command%`.
#   - Dropdowns and sliders must use `NOTPROTON_ENV_<VAR>` IDs; NotProton strips
#     the prefix and writes `<VAR>=<value>` into Steam's launch options.

[NOTPROTON_NOTRECALL_METALFX]
label          = MetalFX upscaling
description    = Adds NVIDIA DLSS to the game's Video options and runs it on Apple's MetalFX for higher frame rates.
tools          = notrecall-proton*
env            = DXMT_ENABLE_NVEXT=1
description_on = In the game's Video settings, choose NVIDIA DLSS. Your Mac does all the work on Apple's MetalFX.

[NOTPROTON_ENV_NOTRECALL_METALFX_SHARPNESS]
label          = Sharpening
description    = Makes the upscaled picture crisper. Applies when MetalFX upscaling is on.
type           = choice
tools          = notrecall-proton*
depends        = NOTPROTON_NOTRECALL_METALFX
choice         = off = Off
choice         = low = Low
choice         = high = High

[NOTPROTON_ENV_NOTRECALL_MOUSE_MODE]
label          = Mouse
description    = How the game reads your mouse. High-precision skips macOS's mouse layer (needs Input Monitoring for Steam; until then it works like Standard).
type           = choice
tools          = notrecall-proton*
choice         = hid = High-precision (Recommended)
choice         = precise = Standard (No permission needed)
choice         = classic = Classic (Recall 1.4 feel)
choice         = off = Standard macOS pointer

[NOTPROTON_ENV_NOTRECALL_MOUSE_RATE]
label          = Mouse polling limit
description    = Caps how many mouse reports per second reach the game in High-precision or Standard mode. Leave on All reports unless a very high-polling mouse causes stutters.
type           = choice
tools          = notrecall-proton*
choice         = all = All reports (Default)
choice         = 2000 = 2,000 Hz
choice         = 1000 = 1,000 Hz
choice         = 500 = 500 Hz
choice         = 250 = 250 Hz

[NOTPROTON_ENV_NOTRECALL_FRAME_PACING]
label          = Lower input lag (Frame pacing)
description    = Waits briefly between frames so each frame samples fresher mouse input. On by default.
type           = choice
tools          = notrecall-proton*
choice         = on = On (Default)
choice         = off = Off

[NOTPROTON_ENV_NOTRECALL_FPS_LIMIT]
label          = Frame rate limit
description    = Caps how many frames per second the game renders. Leave Off to use the game's own FPS cap.
type           = slider
tools          = notrecall-proton*
default        = 0
choice         = 0 = Off
choice         = 60 = 60 FPS
choice         = 90 = 90 FPS
choice         = 120 = 120 FPS
choice         = 144 = 144 FPS
choice         = 240 = 240 FPS

[NOTPROTON_ENV_NOTRECALL_SHADER_MEM_MB]
label          = Shader memory
description    = How much of your shader cache the game loads when it starts. All of it means the fewest stutters; only lower this on an 8 GB Mac.
type           = choice
tools          = notrecall-proton*
choice         = all = All (Default)
choice         = first = Slowest only
choice         = 256 = 256 MB
choice         = 512 = 512 MB
choice         = 1024 = 1 GB
choice         = 2048 = 2 GB

[NOTPROTON_NOTRECALL_MTL_HUD]
label          = Metal Performance HUD
description    = Shows Apple's performance overlay in game: FPS, frame times, and when your Mac is compiling shaders, the cause of first-match stutters.
tools          = notrecall-proton*
env            = MTL_HUD_ENABLED=1

[NOTPROTON_NOTRECALL_FAST_KEYS]
label          = Faster key response (Experimental)
description    = Keys reach the game 1 to 3 ms sooner. With a very fast mouse, menus may hitch slightly.
section        = dev
tools          = notrecall-proton*
env            = WINEMAC_APPKIT_UPDATE_CYCLE=0

[NOTPROTON_NOTRECALL_PROXY_AUTO_DETECT]
label          = Detect network proxy automatically
description    = Only needed on some work or school networks. Off by default so game connections do not stall.
section        = dev
tools          = notrecall-proton*
env            = NOTRECALL_PROXY_AUTO_DETECT=1

[NOTPROTON_NOTRECALL_DISABLE_GAMEMODE]
label          = Turn off Game Mode
description    = Normally macOS gives your game priority on your Mac's processor and graphics while it fills the screen. Turn this on only for troubleshooting.
section        = dev
tools          = notrecall-proton*
env            = NOTRECALL_GAME_MODE=0

[NOTPROTON_NOTRECALL_NO_PRECOMPILE]
label          = Turn off background shader prep
description    = Skips optimizing newly learned shaders in the background after you quit a game.
section        = dev
tools          = notrecall-proton*
env            = NOTRECALL_SKIP_PRECOMPILE=1

[NOTPROTON_NOTRECALL_RAW_CONTROLLERS]
label          = Let games read controllers directly
description    = Lets the game talk to controllers directly instead of through Steam Input. May cause double inputs.
section        = dev
tools          = notrecall-proton*
env            = NOTRECALL_RAW_CONTROLLERS=1

[NOTPROTON_NOTRECALL_DISABLE_MSYNC]
label          = Turn off MSync
description    = Falls back to older synchronization if a game has trouble starting. Leave off for best performance.
section        = dev
tools          = notrecall-proton*
env            = WINEMSYNC=0

[NOTPROTON_NOTRECALL_LOG_CRASHES]
label          = Log crashes and freezes
description    = Records errors and loaded DLLs for crash or freeze bug reports. Can lower FPS while on.
section        = dev
tools          = notrecall-proton*
env            = NOTRECALL_LOG_CRASHES=1

[NOTPROTON_NOTRECALL_LOG_GRAPHICS]
label          = Log graphics
description    = Records graphics layer messages for black screens, glitches, or odd frame rates. Can lower FPS while on.
section        = dev
tools          = notrecall-proton*
env            = NOTRECALL_LOG_GRAPHICS=1

[NOTPROTON_NOTRECALL_LOG_MOUSE]
label          = Log mouse input
description    = Records how mouse movement and clicks reach the game once a second for aim bug reports.
section        = dev
tools          = notrecall-proton*
env            = NOTRECALL_LOG_MOUSE=1
