# NotRecall Steam Play Compatibility Plugin for NotProton
# Installed to: ~/Library/Application Support/notproton/plugins/50-notrecall.conf
# Runtime:      Recall Wine + DXMT on stock NotProton
#
# notrecall-proton is adopted by stock NotProton via compatibilitytools.d/notrecall-proton/{build,flavor},
# so NotProton's hook_launch.c wraps launches in /bin/sh -c (enabling both Compatibility page options and
# custom KEY=VAL %command% launch options without macOS Steam OS Error 260).
#
# [NOTPROTON_NOTRECALL] is the first record so NotProton.app's Plugins tab lists this plugin as "NotRecall"
# and checks live runtime readiness via "requires" (without "inject = 1"). "hide_crossover = 1" suppresses
# CrossOver's built-in checkboxes when NotRecall is selected. Every option below depends on it so toggling
# NotRecall expands/collapses all per-game settings cleanly in Steam's Compatibility tab.

[NOTPROTON_NOTRECALL]
label          = NotRecall
description    = Recall Wine + DXMT settings for macOS. Turn on to customize per-game graphics, input, system, diagnostics, and recovery options.
description_on = Options below override NotRecall.app settings for this game. Explicit KEY=VAL %command% Launch Options still take priority.
description_on = Leave this off to use defaults or NotRecall.app settings. Open NotRecall.app only to install or update the runtime.
section        = dev
tools          = notrecall-proton*
hide_crossover = 1
on             = 1
requires       = Library/Application Support/notrecall/runtime/bin/wine

# ==============================================================================
# Graphics & Performance
# ==============================================================================

[NOTPROTON_NOTRECALL_METALFX]
label          = Graphics · MetalFX Upscaling
description    = Adds NVIDIA DLSS to the game's Video options and runs it on Apple's MetalFX for higher frame rates.
description_on = In Overwatch Video settings, choose NVIDIA DLSS. Your Mac runs it natively on Apple MetalFX.
section        = dev
tools          = notrecall-proton*
depends        = NOTPROTON_NOTRECALL
on             = 1
requires       = Library/Application Support/notrecall/runtime/bin/wine
env            = DXMT_ENABLE_NVEXT=1

[NOTPROTON_ENV_NOTRECALL_METALFX_SHARPNESS]
label          = Sharpening
description    = Makes the upscaled picture crisper when MetalFX Upscaling is on.
section        = dev
type           = choice
tools          = notrecall-proton*
depends        = NOTPROTON_NOTRECALL_METALFX
requires       = Library/Application Support/notrecall/runtime/bin/wine
choice         = off = Off
choice         = low = Low
choice         = high = High

[NOTPROTON_NOTRECALL_MTL_HUD]
label          = Graphics · Metal Performance HUD
description    = Shows Apple's FPS, frame time, memory, and shader compilation overlay in game.
section        = dev
tools          = notrecall-proton*
depends        = NOTPROTON_NOTRECALL
on             = 1
requires       = Library/Application Support/notrecall/runtime/bin/wine
env            = MTL_HUD_ENABLED=1

[NOTPROTON_ENV_NOTRECALL_FRAME_PACING]
label          = Graphics · Lower Input Lag (Frame Pacing)
description    = Waits briefly between frames so each frame samples fresher mouse input. On by default.
section        = dev
type           = choice
tools          = notrecall-proton*
depends        = NOTPROTON_NOTRECALL
requires       = Library/Application Support/notrecall/runtime/bin/wine
choice         = on = On (Default)
choice         = off = Off

[NOTPROTON_ENV_NOTRECALL_FPS_LIMIT]
label          = Graphics · Frame Rate Limit
description    = Caps DXMT frame rate. Leave Off to use the game's own FPS cap.
section        = dev
type           = slider
tools          = notrecall-proton*
depends        = NOTPROTON_NOTRECALL
requires       = Library/Application Support/notrecall/runtime/bin/wine
default        = 0
choice         = 0 = Off
choice         = 60 = 60 FPS
choice         = 90 = 90 FPS
choice         = 120 = 120 FPS
choice         = 144 = 144 FPS
choice         = 240 = 240 FPS

[NOTPROTON_ENV_NOTRECALL_SHADER_MEM_MB]
label          = Graphics · Shader Memory
description    = How much of your shader cache loads at launch. Leave on All for the fewest stutters; only lower on 8 GB Macs.
section        = dev
type           = choice
tools          = notrecall-proton*
depends        = NOTPROTON_NOTRECALL
requires       = Library/Application Support/notrecall/runtime/bin/wine
choice         = all = All (Default)
choice         = first = Slowest Only
choice         = 256 = 256 MB
choice         = 512 = 512 MB
choice         = 1024 = 1 GB
choice         = 2048 = 2 GB

# ==============================================================================
# Mouse & Input
# ==============================================================================

[NOTPROTON_ENV_NOTRECALL_MOUSE_MODE]
label          = Input · Mouse Mode
description    = High-Precision reads your mouse directly, skipping macOS's mouse layer (requires Input Monitoring for Steam; falls back to Standard until granted).
section        = dev
type           = choice
tools          = notrecall-proton*
depends        = NOTPROTON_NOTRECALL
requires       = Library/Application Support/notrecall/runtime/bin/wine
choice         = hid = High-Precision (Recommended)
choice         = precise = Standard (No permission needed)
choice         = classic = Classic (Recall 1.4 feel)
choice         = off = macOS Pointer

[NOTPROTON_ENV_NOTRECALL_MOUSE_RATE]
label          = Input · Mouse Polling Limit
description    = Caps mouse reports per second in High-Precision or Standard mode. Leave on All Reports unless high polling causes stutters.
section        = dev
type           = choice
tools          = notrecall-proton*
depends        = NOTPROTON_NOTRECALL
requires       = Library/Application Support/notrecall/runtime/bin/wine
choice         = all = All Reports (Default)
choice         = 2000 = 2,000 Hz
choice         = 1000 = 1,000 Hz
choice         = 500 = 500 Hz
choice         = 250 = 250 Hz

[NOTPROTON_NOTRECALL_FAST_KEYS]
label          = Input · Faster Key Response (Experimental)
description    = Keys reach the game 1 to 3 ms sooner. Menus may hitch slightly with high-polling mice.
section        = dev
tools          = notrecall-proton*
depends        = NOTPROTON_NOTRECALL
on             = 1
requires       = Library/Application Support/notrecall/runtime/bin/wine
env            = WINEMAC_APPKIT_UPDATE_CYCLE=0

[NOTPROTON_NOTRECALL_RAW_CONTROLLERS]
label          = Input · Raw Controllers (Bypass Steam Input)
description    = Lets the game read controllers directly instead of through Steam Input. May cause double inputs.
section        = dev
tools          = notrecall-proton*
depends        = NOTPROTON_NOTRECALL
on             = 1
requires       = Library/Application Support/notrecall/runtime/bin/wine
env            = NOTRECALL_RAW_CONTROLLERS=1

# ==============================================================================
# System & Runtime
# ==============================================================================

[NOTPROTON_NOTRECALL_DISABLE_GAMEMODE]
label          = System · Turn Off macOS Game Mode
description    = Normally macOS gives your game CPU and GPU priority while fullscreen. Turn off only for troubleshooting.
section        = dev
tools          = notrecall-proton*
depends        = NOTPROTON_NOTRECALL
on             = 1
requires       = Library/Application Support/notrecall/runtime/bin/wine
env            = NOTRECALL_GAME_MODE=0

[NOTPROTON_NOTRECALL_NO_PRECOMPILE]
label          = System · Turn Off Background Shader Optimization
description    = Skips compiling newly learned shaders into archives after each session.
section        = dev
tools          = notrecall-proton*
depends        = NOTPROTON_NOTRECALL
on             = 1
requires       = Library/Application Support/notrecall/runtime/bin/wine
env            = NOTRECALL_SKIP_PRECOMPILE=1

[NOTPROTON_NOTRECALL_DISABLE_MSYNC]
label          = System · Turn Off MSync
description    = Falls back to older synchronization if a game has trouble starting. Leave off for best performance.
section        = dev
tools          = notrecall-proton*
depends        = NOTPROTON_NOTRECALL
on             = 1
requires       = Library/Application Support/notrecall/runtime/bin/wine
env            = WINEMSYNC=0

[NOTPROTON_NOTRECALL_PROXY_AUTO_DETECT]
label          = System · Detect Network Proxy Automatically
description    = Only needed on some work or school networks. Off by default so game connections do not stall.
section        = dev
tools          = notrecall-proton*
depends        = NOTPROTON_NOTRECALL
on             = 1
requires       = Library/Application Support/notrecall/runtime/bin/wine
env            = NOTRECALL_PROXY_AUTO_DETECT=1

[NOTPROTON_NOTRECALL_DISABLE_BT_MIC_FIX]
label          = System · Turn Off Bluetooth Mic Routing
description    = Normally NotRecall routes Wine's mic to your Mac's built-in mic when using Bluetooth headphones to prevent audio quality drop.
section        = dev
tools          = notrecall-proton*
depends        = NOTPROTON_NOTRECALL
on             = 1
requires       = Library/Application Support/notrecall/runtime/bin/wine
env            = NOTRECALL_BT_MIC_FIX=0

# ==============================================================================
# Diagnostics
# ==============================================================================

[NOTPROTON_NOTRECALL_LOG_CRASHES]
label          = Diagnostics · Log Crashes & Freezes
description    = Records Wine errors and loaded DLLs for bug reports. May lower FPS while on.
section        = dev
tools          = notrecall-proton*
depends        = NOTPROTON_NOTRECALL
on             = 1
requires       = Library/Application Support/notrecall/runtime/bin/wine
env            = NOTRECALL_LOG_CRASHES=1

[NOTPROTON_NOTRECALL_LOG_GRAPHICS]
label          = Diagnostics · Log Graphics (DXMT)
description    = Writes detailed graphics logs to compatdata/<appid>/dxmt-logs/. May lower FPS while on.
section        = dev
tools          = notrecall-proton*
depends        = NOTPROTON_NOTRECALL
on             = 1
requires       = Library/Application Support/notrecall/runtime/bin/wine
env            = NOTRECALL_LOG_GRAPHICS=1

[NOTPROTON_NOTRECALL_LOG_MOUSE]
label          = Diagnostics · Log Mouse Input
description    = Records mouse polling stats to compatdata/<appid>/input-logs/. May lower FPS while on.
section        = dev
tools          = notrecall-proton*
depends        = NOTPROTON_NOTRECALL
on             = 1
requires       = Library/Application Support/notrecall/runtime/bin/wine
env            = NOTRECALL_LOG_MOUSE=1

# ==============================================================================
# Recovery
# ==============================================================================

[NOTPROTON_NOTRECALL_REBUILD_SHADERS]
label          = Recovery · Rebuild Shaders
description    = Clears compiled shader archives on launch without forgetting learned shaders. Turn off after one launch.
description_on = Remember to turn this off after your next launch so shaders are not rebuilt every time.
section        = dev
tools          = notrecall-proton*
depends        = NOTPROTON_NOTRECALL
on             = 1
requires       = Library/Application Support/notrecall/runtime/bin/wine
env            = NOTRECALL_REBUILD_SHADERS=1

[NOTPROTON_NOTRECALL_RESET_DISPLAY]
label          = Recovery · Reset Display Settings
description    = Resets Overwatch's fullscreen resolution and display memory on launch while keeping graphics quality and FPS settings.
description_on = Remember to turn this off after launching once so your in-game resolution changes are saved.
section        = dev
tools          = notrecall-proton*
depends        = NOTPROTON_NOTRECALL
on             = 1
requires       = Library/Application Support/notrecall/runtime/bin/wine
env            = NOTRECALL_RESET_DISPLAY=1
