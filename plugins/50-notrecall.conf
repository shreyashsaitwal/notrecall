# NotProton plugin descriptor for NotRecall (notrecall-proton).
# Installed to ~/Library/Application Support/notproton/plugins/50-notrecall.conf
#
# Because notrecall-proton is a third-party compatibility tool (ours=0 in
# NotProton's webpatch.c):
#   - Toggles write their `env = KEY=VAL` entries directly via `env ... %command%`.
#   - Dropdowns and sliders must use `NOTPROTON_ENV_<VAR>` IDs; NotProton strips
#     the prefix and writes `<VAR>=<value>` into Steam's launch options.

[NOTPROTON_NOTRECALL_METALFX]
label          = MetalFX Temporal Upscaling (DLSS)
description    = Exposes NVIDIA DLSS in D3D11 games and runs it on Apple MetalFX temporal upscaling (DXMT_ENABLE_NVEXT=1).
section        = dev
tools          = notrecall-proton*
env            = DXMT_ENABLE_NVEXT=1
description_on = Select DLSS in the game's graphics settings. Uses Recall's signed nvngx.dll and Streamline D3D12 stand-in.

[NOTPROTON_ENV_NOTRECALL_METALFX_SHARPNESS]
label          = MetalFX Sharpness (RCAS)
description    = FidelityFX RCAS sharpening applied after MetalFX temporal upscaling.
type           = slider
tools          = notrecall-proton*
depends        = NOTPROTON_NOTRECALL_METALFX
min            = 0
max            = 1
step           = 0.05
default        = 0

[NOTPROTON_ENV_NOTRECALL_MOUSE_MODE]
label          = Raw Mouse Input
description    = Controls Recall's high-polling mouse driver for the launched game executable.
type           = choice
tools          = notrecall-proton*
choice         = hid = High-Precision Raw HID (up to 8,000 Hz, requires Input Monitoring)
choice         = precise = Game Controller Precise (no Input Monitoring required)
choice         = classic = Game Controller Classic
choice         = off = Standard macOS Pointer

[NOTPROTON_ENV_NOTRECALL_FRAME_PACING]
label          = DXMT Frame Pacing
description    = Sleeps the game thread after frame-latency waits so each frame samples fresher mouse input.
type           = choice
tools          = notrecall-proton*
choice         = off = Off
choice         = on = Balanced (mode 3, 1 ms margin)

[NOTPROTON_ENV_NOTRECALL_FPS_LIMIT]
label          = DXMT Frame Rate Limit
description    = Caps frame rate in DXMT (d3d11.preferredMaxFrameRate).
type           = slider
tools          = notrecall-proton*
default        = 0
choice         = 0 = Off
choice         = 60 = 60 FPS
choice         = 90 = 90 FPS
choice         = 120 = 120 FPS
choice         = 144 = 144 FPS
choice         = 240 = 240 FPS

[NOTPROTON_ENV_NOTRECALL_SHADER_MEM_MB]
label          = Shader Pack Memory Budget
description    = Caps RAM used for preloaded DXMT .metallib shader archives (writes load.json; Default = Unlimited).
type           = choice
tools          = notrecall-proton*
choice         = 256 = 256 MB
choice         = 512 = 512 MB
choice         = 1024 = 1 GB
choice         = 2048 = 2 GB

[NOTPROTON_NOTRECALL_FAST_KEYS]
label          = Faster Key Response (Experimental)
description    = Disables AppKit's display-synced event loop (WINEMAC_APPKIT_UPDATE_CYCLE=0) for lower keyboard latency.
section        = dev
tools          = notrecall-proton*
env            = WINEMAC_APPKIT_UPDATE_CYCLE=0

[NOTPROTON_NOTRECALL_MSYNC]
label          = Enable MSync
description    = Uses Wine MSync synchronization (safe with Recall's ntdll.so thread-exit fd fix).
section        = dev
tools          = notrecall-proton*
env            = WINEMSYNC=1

[NOTPROTON_NOTRECALL_RAW_CONTROLLERS]
label          = Let Games Read Controllers Directly
description    = Skips WineBus Hidraw=0 controller hiding (may break Steam Input; off by default).
section        = dev
tools          = notrecall-proton*
env            = NOTRECALL_RAW_CONTROLLERS=1

[NOTPROTON_NOTRECALL_MTL_HUD]
label          = Metal Performance HUD
description    = Displays Apple's Metal HUD overlay (FPS, frame time, memory).
section        = dev
tools          = notrecall-proton*
env            = MTL_HUD_ENABLED=1

[NOTPROTON_NOTRECALL_NO_PRECOMPILE]
label          = Disable Post-Session Shader Precompilation
description    = Skips running Recall's background portable-pipeline archive compiler after exiting a game.
section        = dev
tools          = notrecall-proton*
env            = NOTRECALL_SKIP_PRECOMPILE=1

[NOTPROTON_NOTRECALL_DISABLE_GAMEMODE]
label          = Disable macOS Game Mode
description    = Launches Wine directly instead of through a Game Mode .app wrapper bundle.
section        = dev
tools          = notrecall-proton*
env            = NOTRECALL_GAME_MODE=0
